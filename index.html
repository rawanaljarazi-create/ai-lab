<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aetherwell</title>
  </head>
  <body>
    <div id="hud">
      <div id="title-card">
        <p class="eyebrow">Custom game environment</p>
        <h1>Aetherwell</h1>
        <p class="lede">
          A twilight mesa outpost around a sleeping well. Walk the terraces,
          gather five wellshards, and wake the light.
        </p>
        <p class="hint">Click to enter · WASD move · Shift sprint · Space jump · E collect</p>
      </div>
      <div id="crosshair">+</div>
      <div id="status">
        <span id="shards">Wellshards 0 / 5</span>
        <span id="prompt"></span>
      </div>
    </div>
    <canvas id="game"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
