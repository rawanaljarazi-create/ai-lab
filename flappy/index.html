<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#79c8ff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='14' cy='16' r='11' fill='%23f5c431'/%3E%3Cpath d='M24 16l7-4v8z' fill='%23ef6a2a'/%3E%3C/svg%3E" />
    <title>Flappy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@380;500;620&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="game" aria-label="Flappy, a bird flying through pipes"></canvas>
    <div id="hud">
      <a id="lab-link" href="/">ai-lab</a>
      <button id="mute" type="button" aria-pressed="false">Sound on</button>
      <p id="score" hidden>0</p>
      <p id="record" hidden></p>
      <section id="ready">
        <p class="eyebrow">3D meadow</p>
        <h1>Flappy</h1>
        <p class="lede">One flap. The pipes stay where they are.</p>
        <p class="hint">Click, tap, or space</p>
        <p id="ready-best" class="hint" hidden></p>
      </section>
      <section id="done" hidden>
        <h2 id="done-title">Down</h2>
        <p id="result"></p>
        <p class="hint">Tap or space to fly again</p>
      </section>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
