<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#123528" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Physics</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f7a4c'/%3E%3Ccircle cx='12' cy='18' r='6' fill='%23ff5a36'/%3E%3Crect x='18' y='8' width='8' height='8' rx='1.5' fill='%23ffb703' transform='rotate(18 22 12)'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@380;500;620&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="table" aria-label="Physics sandbox. Tap the felt to drop a shape, then drag to throw it."></canvas>
    <div id="hud">
      <header>
        <a id="lab-link" href="/">ai-lab</a>
        <div class="title">
          <p class="eyebrow">Felt table</p>
          <h1>Physics</h1>
        </div>
        <div class="actions">
          <button id="pause" type="button" aria-pressed="false">Pause</button>
          <button id="reset" type="button">Reset</button>
        </div>
      </header>
      <p id="paused" hidden>Paused</p>
      <footer id="dock">
        <div class="row">
          <div class="tools" role="toolbar" aria-label="Shape to drop">
            <button type="button" data-tool="circle" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle></svg>
              Circle
            </button>
            <button type="button" data-tool="box" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="6" width="14" height="12" rx="1.5"></rect></svg>
              Box
            </button>
            <button type="button" data-tool="polygon" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.2 20 9.4 17.2 19H6.8L4 9.4Z"></path></svg>
              Polygon
            </button>
          </div>
          <label class="check" title="New shapes stay where you drop them">
            <input id="static-spawn" type="checkbox" />
            <span>Static</span>
          </label>
          <button id="toggle-body" type="button" disabled>Make static</button>
        </div>
        <div class="row">
          <label class="gravity">
            <span id="gravity-label">Gravity</span>
            <input id="gravity" type="range" min="-800" max="2400" step="20" value="1400" aria-labelledby="gravity-label" />
            <output id="gravity-read" for="gravity">1400</output>
          </label>
          <p id="count"></p>
        </div>
        <p id="hint"></p>
      </footer>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
