<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070910" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070910'/%3E%3Cpath d='M6 20h4l2-6h8l2 6h4v2H6z' fill='%23f4f7fb'/%3E%3Ccircle cx='11' cy='22' r='2' fill='%23ffb15a'/%3E%3Ccircle cx='21' cy='22' r='2' fill='%23ffb15a'/%3E%3C/svg%3E" />
    <title>Apex</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;9..144,640&family=Outfit:wght@380;500;620&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body data-phase="ready" data-client="desk">
    <canvas id="game" aria-label="Apex, a night harbor race"></canvas>
    <div id="hud">
      <a id="lab-link" href="/">ai-lab</a>
      <div id="top-actions">
        <button id="cam" type="button">Chase</button>
        <button id="mute" type="button" aria-pressed="false">Sound on</button>
      </div>
      <canvas id="map" width="168" height="168" aria-hidden="true"></canvas>
      <div id="readout">
        <p id="pos">1st</p>
        <p id="lap">Lap 1/3</p>
        <p id="speed">0</p>
        <p id="unit">km/h</p>
        <div id="meter" aria-hidden="true"><span id="needle"></span></div>
        <p id="time">0:00.00</p>
        <p id="best" hidden></p>
      </div>
      <p id="wrong" hidden>Wrong way</p>
      <div id="lights" hidden>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <p id="go" hidden>Go</p>
      <section id="ready">
        <div class="panel">
          <p class="eyebrow">Harbor Grand Prix</p>
          <h1>Apex</h1>
          <p class="lede">Three laps. Night circuit. Four cars, one harbor.</p>
          <p id="play-hint" class="hint">Enter to race</p>
          <p id="ready-best" class="hint" hidden></p>
        </div>
      </section>
      <section id="done" hidden>
        <div class="panel">
          <p class="eyebrow">Finish</p>
          <h2 id="done-title">P1</h2>
          <p id="result"></p>
          <p id="again-hint" class="hint">Enter to race again</p>
        </div>
      </section>
      <p id="turn">Turn the phone sideways</p>
      <div id="controls">
        <div id="steer-pad" aria-label="Steering">
          <span id="puck"></span>
        </div>
        <button id="brake" type="button">Brake</button>
        <button id="gas" type="button">Gas</button>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
